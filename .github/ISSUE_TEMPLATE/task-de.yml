name: "Task - DE"
description: "수집, Bronze·Silver·Gold, Job과 데이터 품질 작업"
title: "[DE] "
type: Task
labels: ["team:de", "priority:p0"]
body:
  - type: textarea
    id: task
    attributes: {label: 작업 내용}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: 목적, description: 관련 DE Task와 소비 팀 결과를 적습니다.}
    validations: {required: true}
  - type: textarea
    id: contract
    attributes: {label: 데이터 계약 영향, description: 소스·레이어·생산자·소비자·키·기준 시점의 영향을 적습니다.}
  - type: textarea
    id: scope
    attributes: {label: 범위, value: "포함:\n-\n\n제외:\n-"}
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: "- [ ] 기대 데이터 또는 전달 결과가 생성된다.\n- [ ] 기준 시점·건수·키·중복·필수값·타입을 확인한다.\n- [ ] 재실행 결과와 원천→결과 계보를 확인한다.\n- [ ] 검증 증거와 미확인 사항을 기록한다."
    validations: {required: true}
  - type: textarea
    id: reference
    attributes: {label: 참고, description: 상위 DE-01~05, 계약 문서, 테이블과 Job을 적습니다.}
