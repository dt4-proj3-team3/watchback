name: "Task - Web"
description: "Dependabot 동기화, Case, API·화면과 조치 자동화 작업"
title: "[WEB] "
type: Task
labels: ["team:web", "priority:p0"]
body:
  - type: textarea
    id: task
    attributes: {label: 작업 내용}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: 사용자 결과, description: 관련 WEB Task와 사용자가 확인·수행할 결과를 적습니다.}
    validations: {required: true}
  - type: textarea
    id: contract
    attributes: {label: 연동과 상태 계약, description: Gold·GitHub·Web DB·API의 키, 동기화와 상태 전이를 적습니다.}
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: "- [ ] 정상·빈 결과·실패 상태를 확인한다.\n- [ ] 후보→Alert→Case→화면 또는 조치 결과를 추적할 수 있다.\n- [ ] 조직 접근 범위와 자동화 거부 조건을 확인한다.\n- [ ] 실제 Alert 기반 E2E 증거를 기록한다."
    validations: {required: true}
  - type: textarea
    id: reference
    attributes: {label: 참고, description: 상위 WEB-01~06, API/DB 계약과 화면을 적습니다.}
