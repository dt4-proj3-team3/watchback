name: "Task - DS"
description: "위험 신호, 시스템성 변동, 후보 규칙과 검증 작업"
title: "[DS] "
type: Task
labels: ["team:ds", "priority:p0"]
body:
  - type: textarea
    id: task
    attributes: {label: 작업 내용}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: 목적, description: 관련 DS Task와 재검토 결과를 적습니다.}
    validations: {required: true}
  - type: textarea
    id: input_output
    attributes: {label: 분석 입출력, description: Silver 입력, 출력 키·근거·규칙 버전과 고객 Alert 비의존성을 적습니다.}
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: "- [ ] 반복 실행 가능한 후보와 선정·제외 근거가 생성된다.\n- [ ] 시스템성 변동과 개별 변화를 구분한다.\n- [ ] 대표 사례, 임계값별 후보 수와 해석 한계를 확인한다.\n- [ ] 실제 악용의 정답으로 표현하지 않는다."
    validations: {required: true}
  - type: textarea
    id: reference
    attributes: {label: 참고, description: 상위 DS-01~05, 계약 문서와 Notebook/Job을 적습니다.}
