name: "Task - Product"
description: "제품 범위, Story, Sprint와 데모 흐름 작업"
title: "[PRODUCT] "
type: Task
labels: ["team:product", "priority:p0"]
body:
  - type: textarea
    id: task
    attributes: {label: 작업 내용}
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: 사용자 결과, description: 사용자와 해결할 문제, 기대 결과를 적습니다.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 범위와 우선순위, value: "우선순위: P0 / P1 / P2\n\n포함:\n-\n\n제외:\n-"}
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: "- [ ] PRD·제품 백로그·Sprint Goal과 모순이 없다.\n- [ ] 사용자 수용 기준 또는 데모 결과가 명확하다.\n- [ ] 팀 영향, 의존성과 남은 리스크가 기록된다."
    validations: {required: true}
  - type: textarea
    id: reference
    attributes: {label: 참고, description: 관련 US-01~07, 제품 문서와 화면을 적습니다.}
