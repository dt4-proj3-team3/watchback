name: "Task"
description: "팀 공통 작업 이슈"
title: ""
type: Task
body:
  - type: textarea
    id: task
    attributes: {label: 작업 내용, description: 무엇을 작업하는지 적습니다.}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: 목적, description: 어떤 Story나 Sprint 결과에 필요한지 적습니다.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes:
      label: 범위
      value: "포함:\n-\n\n제외:\n-"
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: "- [ ] 기대 결과가 충족된다.\n- [ ] 검증 결과와 근거가 PR 또는 이슈에 기록된다.\n- [ ] 확인하지 못한 항목과 이유가 기록된다."
    validations: {required: true}
  - type: textarea
    id: validation
    attributes:
      label: 확인 관점
      value: "정상 케이스:\n-\n\n실패·경계 케이스:\n-\n\n확인할 데이터·상태·로그:\n-"
  - type: textarea
    id: reference
    attributes: {label: 참고, description: 상위 Story/Task, 관련 문서와 의존성을 적습니다.}
